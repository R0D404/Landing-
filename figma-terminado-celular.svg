<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>
      .bg { fill: #f0f8ff; }
      .card-bg { fill: #ffffff; stroke: #b8ddf0; stroke-width: 1.5; filter: drop-shadow(0 2px 6px rgba(58,171,223,0.1)); }
      .text-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; }
      .text-body { font-family: sans-serif; font-size: 11px; fill: #5a7a8a; }
      .text-accent { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #1e88c4; }
      .pill-bg { fill: #ffffff; stroke: #b8ddf0; stroke-width: 1.2; rx: 12; }
    </style>
    <linearGradient id="heroGradMob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6eeff"/>
      <stop offset="60%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="avatarGradMob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aabdf"/>
      <stop offset="100%" stop-color="#1e88c4"/>
    </linearGradient>
  </defs>

  <!-- Frame Device Body -->
  <rect width="390" height="844" rx="36" fill="#f0f8ff" stroke="#334155" stroke-width="6"/>

  <!-- Dynamic Island -->
  <rect x="135" y="12" width="120" height="24" rx="12" fill="#0f172a"/>

  <!-- Top Frame tag -->
  <text x="25" y="55" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e88c4">[FRAME: Celular Terminado (390x844)]</text>

  <!-- Nav Mobile -->
  <rect x="0" y="65" width="390" height="50" fill="#ffffff"/>
  <line x1="0" y1="115" x2="390" y2="115" stroke="#b8ddf0" stroke-width="1"/>
  <text x="25" y="97" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3aabdf">RGM</text>
  <text x="345" y="96" font-family="sans-serif" font-size="20" fill="#1a1a2e">☰</text>

  <!-- Hero Mobile -->
  <rect x="0" y="116" width="390" height="245" fill="url(#heroGradMob)"/>
  
  <circle cx="195" cy="180" r="50" fill="url(#avatarGradMob)" stroke="#3aabdf" stroke-width="3"/>
  <text x="195" y="180" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#ffffff">👨‍💻</text>
  <text x="195" y="200" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">RGM</text>

  <text x="195" y="250" class="text-title" font-size="16" text-anchor="middle">Rodrigo González Morales</text>
  <text x="195" y="270" class="text-accent" font-size="10" text-anchor="middle">4to Cuatrimestre • IT2ID</text>
  <text x="195" y="290" class="text-body" font-size="10" text-anchor="middle">Estudiante de Ing. Tecnologías de la Información</text>
  
  <rect x="135" y="310" width="120" height="30" rx="15" fill="#3aabdf"/>
  <text x="195" y="329" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Ver proyectos</text>

  <!-- Proyectos Mobile -->
  <text x="195" y="380" class="text-title" font-size="14" text-anchor="middle">Proyectos</text>
  <rect x="175" y="386" width="40" height="2" rx="1" fill="#3aabdf"/>

  <!-- Card SAM -->
  <rect x="25" y="400" width="340" height="85" rx="10" class="card-bg"/>
  <text x="45" y="430" font-family="sans-serif" font-size="20">🐝</text>
  <text x="75" y="425" class="text-title" font-size="14">SAM</text>
  <text x="75" y="440" class="text-accent" font-size="9">SMART APIARY MONITORING</text>
  <text x="45" y="465" class="text-body" font-size="10">Monitoreo inteligente de colmenas en tiempo real.</text>

  <!-- Card Z-Core -->
  <rect x="25" y="495" width="340" height="85" rx="10" class="card-bg"/>
  <text x="45" y="525" font-family="sans-serif" font-size="20">⚡</text>
  <text x="75" y="520" class="text-title" font-size="14">Z-Core</text>
  <text x="75" y="535" class="text-accent" font-size="9">ALTO RENDIMIENTO</text>
  <text x="45" y="560" class="text-body" font-size="10">Arquitectura y eficiencia computacional.</text>

  <!-- Habilidades Mobile -->
  <rect x="0" y="595" width="390" height="110" fill="#e4f3fc"/>
  <text x="195" y="618" class="text-title" font-size="13" text-anchor="middle">Habilidades</text>

  <g transform="translate(30, 630)">
    <g transform="translate(0, 0)"><rect width="65" height="24" class="pill-bg"/><text x="32" y="16" class="text-title" font-size="10" text-anchor="middle">🌐 HTML</text></g>
    <g transform="translate(70, 0)"><rect width="60" height="24" class="pill-bg"/><text x="30" y="16" class="text-title" font-size="10" text-anchor="middle">🎨 CSS</text></g>
    <g transform="translate(135, 0)"><rect width="55" height="24" class="pill-bg"/><text x="27" y="16" class="text-title" font-size="10" text-anchor="middle">⚙️ JS</text></g>
    <g transform="translate(195, 0)"><rect width="45" height="24" class="pill-bg"/><text x="22" y="16" class="text-title" font-size="10" text-anchor="middle">🔧 C</text></g>
    <g transform="translate(245, 0)"><rect width="50" height="24" class="pill-bg"/><text x="25" y="16" class="text-title" font-size="10" text-anchor="middle">🔩 C++</text></g>
    <g transform="translate(300, 0)"><rect width="55" height="24" class="pill-bg"/><text x="27" y="16" class="text-title" font-size="10" text-anchor="middle">☕ Java</text></g>
  </g>
  <rect x="110" y="665" width="170" height="24" class="pill-bg"/>
  <text x="195" y="681" class="text-title" font-size="10" text-anchor="middle">🌐 Cisco Packet Tracer</text>

  <!-- Contacto Mobile -->
  <text x="195" y="730" class="text-title" font-size="13" text-anchor="middle">Contacto</text>
  <rect x="35" y="742" width="320" height="40" rx="8" fill="#ffffff" stroke="#3aabdf" stroke-width="1.8"/>
  <text x="195" y="767" class="text-accent" font-size="10" text-anchor="middle">✉️ 253696@it2id.upchiamas.edu.mx</text>

  <!-- Home Indicator -->
  <rect x="125" y="825" width="140" height="4" rx="2" fill="#0f172a"/>
</svg>
