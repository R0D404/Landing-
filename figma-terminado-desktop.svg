<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .bg { fill: #f0f8ff; }
      .nav-bg { fill: #ffffff; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.05)); }
      .card-bg { fill: #ffffff; stroke: #b8ddf0; stroke-width: 1.5; filter: drop-shadow(0 4px 12px rgba(58,171,223,0.12)); }
      .text-title { font-family: sans-serif; font-size: 26px; font-weight: bold; fill: #1a1a2e; }
      .text-body { font-family: sans-serif; font-size: 14px; fill: #5a7a8a; }
      .text-accent { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #1e88c4; }
      .pill-bg { fill: #ffffff; stroke: #b8ddf0; stroke-width: 1.5; rx: 16; }
    </style>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6eeff"/>
      <stop offset="60%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aabdf"/>
      <stop offset="100%" stop-color="#1e88c4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" class="bg"/>

  <!-- Top label -->
  <text x="40" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e88c4">[FIGMA FRAME: Desktop - Terminado (1200x900)]</text>

  <!-- Navbar -->
  <rect x="0" y="45" width="1200" height="65" class="nav-bg"/>
  <line x1="0" y1="110" x2="1200" y2="110" stroke="#b8ddf0" stroke-width="1"/>
  <text x="80" y="86" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3aabdf">RGM</text>

  <g transform="translate(780, 85)" font-family="sans-serif" font-size="14">
    <text x="0" y="0" font-weight="bold" fill="#1e88c4">Inicio</text>
    <text x="70" y="0" fill="#5a7a8a">Proyectos</text>
    <text x="170" y="0" fill="#5a7a8a">Habilidades</text>
    <text x="280" y="0" fill="#5a7a8a">Contacto</text>
  </g>

  <!-- Hero Section -->
  <rect x="0" y="111" width="1200" height="290" fill="url(#heroGrad)"/>
  
  <!-- Avatar Circle -->
  <circle cx="240" cy="255" r="85" fill="url(#avatarGrad)" stroke="#3aabdf" stroke-width="4"/>
  <text x="240" y="250" font-family="sans-serif" font-size="34" text-anchor="middle" fill="#ffffff">👨‍💻</text>
  <text x="240" y="285" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">RGM</text>

  <!-- Hero Text -->
  <text x="370" y="210" class="text-title" font-size="32">Rodrigo González Morales</text>
  <text x="370" y="240" class="text-accent">Estudiante de Ing. Tecnologías de la Información e Innovación Digital</text>
  <text x="370" y="270" class="text-body" font-size="15">Actualmente cursando el 4to cuatrimestre. Apasionado por el desarrollo web y la innovación.</text>
  
  <rect x="370" y="300" width="160" height="42" rx="21" fill="#3aabdf"/>
  <text x="450" y="326" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Ver proyectos</text>

  <!-- Proyectos Section -->
  <text x="600" y="440" class="text-title" text-anchor="middle">Proyectos</text>
  <rect x="575" y="448" width="50" height="3" rx="1.5" fill="#3aabdf"/>

  <!-- Card SAM -->
  <rect x="140" y="475" width="440" height="150" rx="12" class="card-bg"/>
  <text x="170" y="515" font-family="sans-serif" font-size="28">🐝</text>
  <text x="215" y="510" class="text-title" font-size="20">SAM</text>
  <text x="215" y="530" class="text-accent" font-size="11">SMART APIARY MONITORING</text>
  <text x="170" y="565" class="text-body">Sistema inteligente de monitoreo de colmenas para supervisión en tiempo real.</text>

  <!-- Card Z-Core -->
  <rect x="620" y="475" width="440" height="150" rx="12" class="card-bg"/>
  <text x="650" y="515" font-family="sans-serif" font-size="28">⚡</text>
  <text x="695" y="510" class="text-title" font-size="20">Z-Core</text>
  <text x="695" y="530" class="text-accent" font-size="11">SISTEMA DE ALTO RENDIMIENTO</text>
  <text x="650" y="565" class="text-body">Arquitectura robusta enfocada en rendimiento, escalabilidad y eficiencia.</text>

  <!-- Habilidades Section -->
  <rect x="0" y="655" width="1200" height="110" fill="#e4f3fc"/>
  <text x="600" y="685" class="text-title" font-size="20" text-anchor="middle">Habilidades</text>

  <g transform="translate(180, 705)">
    <g transform="translate(0, 0)"><rect width="100" height="34" class="pill-bg"/><text x="50" y="22" class="text-title" font-size="13" text-anchor="middle">🌐 HTML</text></g>
    <g transform="translate(112, 0)"><rect width="90" height="34" class="pill-bg"/><text x="45" y="22" class="text-title" font-size="13" text-anchor="middle">🎨 CSS</text></g>
    <g transform="translate(214, 0)"><rect width="110" height="34" class="pill-bg"/><text x="55" y="22" class="text-title" font-size="13" text-anchor="middle">⚙️ JavaScript</text></g>
    <g transform="translate(336, 0)"><rect width="75" height="34" class="pill-bg"/><text x="37" y="22" class="text-title" font-size="13" text-anchor="middle">🔧 C</text></g>
    <g transform="translate(423, 0)"><rect width="85" height="34" class="pill-bg"/><text x="42" y="22" class="text-title" font-size="13" text-anchor="middle">🔩 C++</text></g>
    <g transform="translate(520, 0)"><rect width="95" height="34" class="pill-bg"/><text x="47" y="22" class="text-title" font-size="13" text-anchor="middle">☕ Java</text></g>
    <g transform="translate(627, 0)"><rect width="185" height="34" class="pill-bg"/><text x="92" y="22" class="text-title" font-size="13" text-anchor="middle">🌐 Cisco Packet Tracer</text></g>
  </g>

  <!-- Contacto Section -->
  <text x="600" y="800" class="text-title" font-size="20" text-anchor="middle">Contacto</text>
  <rect x="420" y="818" width="360" height="42" rx="10" fill="#ffffff" stroke="#3aabdf" stroke-width="2"/>
  <text x="600" y="844" class="text-accent" font-size="13" text-anchor="middle">✉️ 253696@it2id.upchiamas.edu.mx</text>

  <!-- Footer -->
  <line x1="0" y1="875" x2="1200" y2="875" stroke="#b8ddf0" stroke-width="1"/>
  <text x="600" y="890" font-family="sans-serif" font-size="11" fill="#5a7a8a" text-anchor="middle">&copy; 2026 Rodrigo González Morales</text>
</svg>
